<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#153c53"><title>PLUV — Protótipo</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#173042;background:#f3f7f8;font-size:14px}
*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:780px;margin:auto;padding:0 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;gap:15px}.brand{display:flex;align-items:center;gap:11px}.brand-icon{display:grid;place-items:center;background:#17627c;color:white;font-size:22px;width:43px;height:43px;border-radius:14px}.brand b{font-size:21px}.muted{color:#6f8190}.small{font-size:12px}.chip{padding:6px 10px;background:#e2f4e9;color:#23764c;border-radius:20px;font-weight:650;font-size:11px}
.alert{background:#fff8e8;color:#76571d;border:1px solid #f2dfb9;padding:11px 13px;border-radius:10px;font-size:12px;line-height:1.5;margin-bottom:22px}
h1{font-size:23px;letter-spacing:-.6px;margin:0}h2{font-size:16px;margin:0}.hero{background:#153c53;color:white;border-radius:19px;padding:22px;margin:16px 0}.hero span{color:#c2dee5;font-size:12px}.hero strong{display:block;font-size:37px;letter-spacing:-1px;margin:7px 0}.hero strong em{font-size:17px;font-weight:500;font-style:normal}
.kpis,.gauges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile,.gauge,.reading{background:white;border:1px solid #dce8ec;border-radius:15px;padding:15px;box-shadow:0 3px 13px #17304208}.tile b{display:block;font-size:25px;margin:6px 0}.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:24px 0 12px}.btn{border:0;border-radius:10px;background:#0d7d96;color:white;font-weight:650;padding:10px 14px}.btn.light{background:#e8f2f4;color:#17596b}.btn.danger{background:#fbebed;color:#aa394a}.btn.mini{font-size:12px;padding:8px 10px}.gauge{text-align:left;width:100%;min-height:143px;display:flex;flex-direction:column;justify-content:space-between}.gauge:focus-visible,.btn:focus-visible{outline:3px solid #5eb9ce}.gauge .name{font-size:15px;font-weight:750;margin:7px 0 4px;overflow-wrap:anywhere}.gauge .rain{font-size:23px;font-weight:750;margin-top:12px}.gauge .rain small{color:#728592;font-size:12px;font-weight:450}.detail{display:flex;align-items:start;justify-content:space-between;gap:8px}.back{border:0;background:none;color:#0c7186;font-weight:650;padding:0;margin:0 0 16px}.reading{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:9px}.reading strong{font-size:16px}.reading .notes{font-size:12px;color:#617987;margin-top:4px;overflow-wrap:anywhere}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{background:white;border:1px dashed #c4d9df;border-radius:13px;padding:26px;text-align:center;color:#74828c}
footer{margin-top:28px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.overlay{display:none;position:fixed;inset:0;background:#092432ac;align-items:center;justify-content:center;padding:12px;z-index:5}.overlay.active{display:flex}.dialog{background:white;width:min(100%,450px);border-radius:17px;padding:20px;max-height:93vh;overflow:auto}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.field{margin-bottom:14px}.field label{display:block;font-weight:650;font-size:12px;margin-bottom:6px}.field input,.field textarea{display:block;width:100%;padding:11px;border:1px solid #d0dfe5;border-radius:9px;background:#fbfdfe;color:#173042}.field textarea{min-height:74px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:17px}
@media(max-width:420px){.wrap{padding:0 12px 45px}.gauge{padding:13px;min-height:132px}.gauge .name{font-size:13px}.hero{padding:18px}.hero strong{font-size:33px}.detail{flex-direction:column}.detail button{align-self:end}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><span class="brand-icon">💧</span><div><b>PLUV</b><div class="muted small">Controle de pluviômetros</div></div></div><span class="chip">● Modo local</span></header>
<div class="alert"><b>PRÉVIA VISUAL</b> — Os dados são armazenados apenas neste navegador, sem comunicação com a VPS. O aplicativo Android definitivo será construído depois da aprovação da interface.</div>
<main id="app"></main>
<footer><span class="small muted">Prévia PLUV — dados de demonstração</span><div class="actions"><button class="btn light mini" id="export">Exportar JSON</button><button class="btn light mini" id="reset">Restaurar exemplos</button></div></footer>
</div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="dialog"><div class="dialog-head"><h2 id="modal-title">Novo registro</h2><button class="btn light mini" id="close" type="button">Fechar</button></div><form id="form"></form></div></div>
<script>
(function () {
"use strict";
var key="pluv-preview-1", app=document.getElementById("app"), overlay=document.getElementById("overlay");
var uid=function(){return crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(36).slice(2)};
function defaults(){return {gauges:[{id:uid(),name:"Sede",location:"Área administrativa",description:"Perto da sede"},{id:uid(),name:"Talhão 03",location:"Área norte",description:""},{id:uid(),name:"Retiro",location:"Área do retiro",description:""},{id:uid(),name:"Pivô 01",location:"Lavoura",description:""}],readings:[]}}
var db;try{db=JSON.parse(localStorage.getItem(key))||defaults();if(!Array.isArray(db.gauges)||!Array.isArray(db.readings))throw Error("Formato inválido")}catch(_){db=defaults()}
var screen="home",selected=null;
function persist(){localStorage.setItem(key,JSON.stringify(db))}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(v){return Number(v).toLocaleString("pt-BR",{maximumFractionDigits:2})}
function date(v){return new Date(v).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}
function dateInput(v){var d=new Date(v||Date.now());return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function total(id){return db.readings.filter(function(r){return !id||r.gaugeId===id}).reduce(function(a,r){return a+Number(r.mm)},0)}
function render(){
 if(screen==="home"){
 app.innerHTML='<h1>Visão geral</h1><p class="muted small">Acompanhe suas medições de chuva</p><div class="hero"><span>Somatório de todos os registros</span><strong>'+fmt(total())+' <em>mm</em></strong><span>Registros salvos neste navegador</span></div><div class="kpis"><div class="tile"><span class="muted small">Pluviômetros</span><b>'+db.gauges.length+'</b></div><div class="tile"><span class="muted small">Medições</span><b>'+db.readings.length+'</b></div></div><div class="section"><h2>Pluviômetros</h2><button class="btn mini" data-action="new-gauge">+ Novo</button></div><div class="gauges">'+db.gauges.map(function(g){return '<button class="gauge" data-id="'+esc(g.id)+'"><div><div>💧</div><div class="name">'+esc(g.name)+'</div><div class="muted small">'+esc(g.location||"Sem localização")+'</div></div><div class="rain">'+fmt(total(g.id))+' <small>mm</small></div></button>'}).join("")+'</div>'+(db.gauges.length?"":'<div class="empty">Nenhum pluviômetro cadastrado.</div>');
 }else{
 var g=db.gauges.find(function(x){return x.id===selected});if(!g){screen="home";render();return}
 var rs=db.readings.filter(function(x){return x.gaugeId===selected}).sort(function(a,b){return b.at.localeCompare(a.at)});
 app.innerHTML='<button class="back" data-action="home">← Voltar</button><div class="detail"><div><h1>'+esc(g.name)+'</h1><p class="muted small">'+esc(g.location||"Local não informado")+'</p></div><button class="btn light mini" data-action="edit-gauge">Editar pluviômetro</button></div><div class="hero"><span>Chuva acumulada neste pluviômetro</span><strong>'+fmt(total(selected))+' <em>mm</em></strong><span>'+rs.length+' medições</span></div><div class="tile"><b style="font-size:13px;margin:0">Descrição</b><p class="muted small">'+esc(g.description||"Não informada")+'</p></div><div class="section"><h2>Histórico de chuvas</h2><button class="btn mini" data-action="new-reading">+ Registrar</button></div>'+(rs.length?rs.map(function(r){return '<div class="reading"><div><strong>'+fmt(r.mm)+' mm</strong><div class="muted small">'+esc(date(r.at))+'</div><div class="notes">'+esc(r.notes||"Sem observações")+'</div></div><div class="actions"><button class="btn light mini" data-edit="'+esc(r.id)+'">Editar</button><button class="btn danger mini" data-delete="'+esc(r.id)+'">Excluir</button></div></div>'}).join(""):'<div class="empty">Nenhuma medição cadastrada.</div>')+'<div class="section"><button class="btn danger mini" data-action="delete-gauge">Excluir pluviômetro</button></div>';
 }
}
function hide(){overlay.classList.remove("active")}
function show(title,fields,onSave){
 document.getElementById("modal-title").textContent=title;
 var form=document.getElementById("form");form.innerHTML=fields+'<div class="dialog-actions"><button type="button" class="btn light" id="cancel">Cancelar</button><button type="submit" class="btn">Salvar</button></div>';
 document.getElementById("cancel").onclick=hide;
 form.onsubmit=function(e){e.preventDefault();onSave(new FormData(form))};
 overlay.classList.add("active");var first=form.querySelector("input");if(first)first.focus();
}
function input(name,label,value,required){return '<div class="field"><label for="'+name+'">'+label+'</label><input id="'+name+'" name="'+name+'" maxlength="160" value="'+esc(value||"")+'" '+(required?"required":"")+'></div>'}
function gaugeEditor(id){
 var g=db.gauges.find(function(x){return x.id===id});
 show(g?"Editar pluviômetro":"Novo pluviômetro",input("name","Nome",g&&g.name,true)+input("location","Localização",g&&g.location,false)+'<div class="field"><label for="description">Descrição</label><textarea id="description" name="description" maxlength="2000">'+esc(g&&g.description||"")+'</textarea></div>',function(d){
 var o={id:g?g.id:uid(),name:String(d.get("name")).trim(),location:String(d.get("location")).trim(),description:String(d.get("description")).trim()};if(!o.name)return;
 if(g)Object.assign(g,o);else db.gauges.push(o);
 persist();hide();render()
 });
}
function readingEditor(id){
 var r=db.readings.find(function(x){return x.id===id});
 var fields='<div class="field"><label for="mm">Chuva (mm)</label><input type="number" id="mm" name="mm" required min="0" max="10000" step="0.01" value="'+esc(r?r.mm:"")+'"></div><div class="field"><label for="at">Data e hora</label><input type="datetime-local" id="at" name="at" required value="'+esc(dateInput(r&&r.at))+'"></div><div class="field"><label for="notes">Observações</label><textarea id="notes" name="notes" maxlength="2000">'+esc(r&&r.notes||"")+'</textarea></div>';
 show(r?"Editar medição":"Registrar chuva",fields,function(d){
 var mm=Number(d.get("mm")),dt=new Date(String(d.get("at")));
 if(!Number.isFinite(mm)||mm<0||mm>10000||isNaN(dt.getTime())){alert("Verifique a medição.");return}
 var o={id:r?r.id:uid(),gaugeId:selected,mm:mm,at:dt.toISOString(),notes:String(d.get("notes")).trim()};
 if(r)Object.assign(r,o);else db.readings.push(o);
 persist();hide();render()
 });
}
app.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 if(b.dataset.id){selected=b.dataset.id;screen="detail";render();return}
 if(b.dataset.edit){readingEditor(b.dataset.edit);return}
 if(b.dataset.delete){if(confirm("Excluir esta medição?")){db.readings=db.readings.filter(function(x){return x.id!==b.dataset.delete});persist();render()}return}
 switch(b.dataset.action){
 case "home":screen="home";render();break;
 case "new-gauge":gaugeEditor();break;
 case "edit-gauge":gaugeEditor(selected);break;
 case "new-reading":readingEditor();break;
 case "delete-gauge":if(confirm("Excluir este pluviômetro e todas as medições da prévia?")){db.gauges=db.gauges.filter(function(x){return x.id!==selected});db.readings=db.readings.filter(function(x){return x.gaugeId!==selected});screen="home";persist();render()}break;
 }
});
document.getElementById("close").onclick=hide;
document.getElementById("reset").onclick=function(){if(confirm("Substituir seus registros locais pelos exemplos?")){db=defaults();screen="home";persist();render()}};
document.getElementById("export").onclick=function(){var blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="pluv-preview.json";a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)};
persist();render();
})();
</script>
</body></html>
